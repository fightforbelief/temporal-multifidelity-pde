[project]
name = "temporal-mf"
version = "0.1.0"
description = "Cost-matched multi-fidelity study of time-dependent PDE surrogates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "scipy",
  "h5py",
  "pyyaml",
  "matplotlib",
  "pandas",
  "scikit-learn",
  "torch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-q"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
